<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>POC image animation runtime check</title>
  </head>
  <body>
    <canvas id="c" width="520" height="400"></canvas>
    <pre id="out">loading</pre>
    <script src="/vendor/rive.js"></script>
    <script>
      const runtime = window.rive
      runtime.RuntimeLoader.setWasmUrl('/vendor/rive.wasm')
      runtime.RuntimeLoader.setWasmFallbackUrl(null)
      const canvas = document.getElementById('c')
      const out = document.getElementById('out')
      const inst = new runtime.Rive({
        src: '/poc-image-animation.riv',
        canvas,
        artboard: 'PocImageAnim',
        stateMachines: 'PocImageSM',
        autoplay: true,
        onLoad: () => {
          inst.resizeDrawingSurfaceToCanvas()
          const inputs = inst.stateMachineInputs('PocImageSM') || []
          const soft = inputs.find((input) => input.name === 'softPose')
          const frames = inputs.find((input) => input.name === 'frames')
          let softFired = false
          let framesFired = false
          let fireError = null
          try {
            if (!soft || !frames) throw new Error('expected softPose and frames triggers')
            soft.fire()
            softFired = true
            frames.fire()
            framesFired = true
          } catch (error) {
            fireError = String(error)
          }
          const report = {
            runtime: '2.48.0',
            package: '@rive-app/canvas',
            activeArtboard: inst.activeArtboard,
            stateMachines: inst.stateMachineNames,
            animations: inst.animationNames,
            inputs: inputs.map((input) => ({ name: input.name, type: input.type })),
            softFired,
            framesFired,
            fireError,
          }
          out.textContent = JSON.stringify(report, null, 2)
          window.__poc = report
        },
        onLoadError: (error) => {
          const report = { ok: false, error: String(error) }
          out.textContent = JSON.stringify(report, null, 2)
          window.__poc = report
        },
      })
    </script>
  </body>
</html>
